<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Flood Risk Predictor</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root {
        --bg: #ffffff;
        --fg: #000000;
        --top-bar-bg: #4CAF50;
        --sidebar-bg: #f2f2f2;
        --map-bg: #e5e5e5;
        --modal-bg: #ffffff;
        --modal-fg: #000000;
        }

        @media (prefers-color-scheme: dark) {
        :root {
            --bg: #121212;
            --fg: #ffffff;
            --top-bar-bg: #388e3c;
            --sidebar-bg: #1e1e1e;
            --map-bg: #2c2c2c;
            --modal-bg: #1e1e1e;
            --modal-fg: #ffffff;
        }
        }

        * {
        box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--fg);
        height: 100vh;
        display: flex;
        flex-direction: column;
        }

        .top-bar {
        height: 50px;
        background-color: var(--top-bar-bg);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 1em;
        font-size: 20px;
        position: relative;
        }

        .menu-dropdown {
        position: relative;
        }

        .menu-button {
        background: none;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        }

        .menu-content {
        display: none;
        position: absolute;
        right: 0;
        top: 50px;
        background: var(--sidebar-bg);
        min-width: 160px;
        box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        z-index: 200;
        }

        .menu-content a {
        display: block;
        padding: 10px 15px;
        text-decoration: none;
        color: var(--fg);
        }

        .menu-content a:hover {
        background-color: #ccc;
        }

        .main-content {
        flex: 1;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        }

        .map-viewport {
        flex: 1;
        background-color: var(--map-bg);
        }

        .Right-bar {
        width: 20%;
        background-color: var(--sidebar-bg);
        overflow-y: auto;
        transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 768px) {
        .Right-bar {
            position: absolute;
            top: 50px;
            right: 0;
            width: 80%;
            height: calc(100% - 50px);
            z-index: 100;
            transform: translateX(100%);
        }

        .Right-bar.active {
            transform: translateX(0);
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
        }

        .menu-dropdown {
            display: none;
        }

        .toggle-sidebar {
            display: block;
        }
        }

        .toggle-sidebar {
        display: none;
        background: white;
        color: black;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 14px;
        cursor: pointer;
        }

        /* Modal styles */
        .modal {
        display: none;
        position: fixed;
        top: 60px;
        right: 20px;
        background: var(--modal-bg);
        color: var(--modal-fg);
        padding: 1em;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.3);
        border-radius: 8px;
        z-index: 300;
        max-width: 300px;
        
        }

        .modal.show {
        display: block;
        }

        /* Light/Dark override support */
        [data-theme="dark"] {
            --bg: #121212;
            --fg: #ffffff;
            --top-bar-bg: #388e3c;
            --sidebar-bg: #1e1e1e;
            --map-bg: #2c2c2c;
            --modal-bg: #1e1e1e;
            --modal-fg: #ffffff;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
            --top-bar-bg: #4CAF50;
            --sidebar-bg: #f2f2f2;
            --map-bg: #e5e5e5;
            --modal-bg: #ffffff;
            --modal-fg: #000000;
        }
        .loading {
        opacity: 0.7;
        pointer-events: none;
        }
        
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
        }
        
        .alert-info {
            background: #3498db;
            color: white;
        }
        
        .alert-error {
            background: #e74c3c;
            color: white;
        }
        
        .risk-low { color: #2ecc71; }
        .risk-medium { color: #f1c40f; }
        .risk-high { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="top-bar">
        Flood Risk Predictor
        <button class="toggle-sidebar">☰ Menu</button>

        <div class="menu-dropdown">
        <button class="menu-button">☰ Menu</button>
        <div class="menu-content">
            <a href="#" id="theme-settings">Theme Settings</a>
            <a href="#" id="about-link">About</a>
        </div>
        </div>
    </div>

    <div class="main-content">
        <div class="map-viewport" id="map">
        <!-- Mapbox map goes here -->
        </div>
        <div class="Right-bar" id="sidebar">
            <!-- Sidebar content -->
            <form id="search-form">
                <select id="city-input" required>
                    <option value="">Select City</option>
                    <option value="Kampala">Kampala</option>
                    <option value="Kasese">Kasese</option>
                    <option value="Kabale">Kabale</option>
                </select>
                
                <input type="date" id="date-input" required>
                
                <button type="submit">Show Flood Prediction</button>
            </form>
        </div>
    </div>
    
    <!-- About Modal -->
    <div class="modal" id="about-modal">
        <strong>About Flood Risk Predictor</strong>
        <p>This tool helps visualize and predict potential flood risks using geospatial and environmental data.</p>
        <p>Built with ❤️ by your team.</p>
    </div>
    
    <!-- Theme Settings Modal -->
    <div class="modal" id="theme-modal">
        <strong>Theme Settings</strong>
        <p>Select your preferred theme:</p>
        <div style="margin-top: 1em;">
            <label><input type="radio" name="theme" value="light"> Light</label><br/>
            <label><input type="radio" name="theme" value="dark"> Dark</label><br/>
            <label><input type="radio" name="theme" value="system"> System Default</label>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    
</body>
</html>
