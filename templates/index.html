<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 Flood Risk Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .input-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .input-row {
            display: flex;
            gap: 20px;
            align-items: end;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
        }

        .input-group select,
        .input-group input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group select:focus,
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .predict-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dashboard {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .dashboard.active {
            display: grid;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .risk-overview {
            text-align: center;
            grid-column: 1 / -1;
        }

        .risk-level {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .risk-advice {
            font-size: 1.1rem;
            color: #666;
            margin-top: 10px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .meter-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .meter {
            position: relative;
            width: 120px;
            height: 60px;
            overflow: hidden;
        }

        .meter-bg {
            width: 100%;
            height: 100%;
            background: #e0e0e0;
            border-radius: 60px 60px 0 0;
            position: relative;
        }

        .meter-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100%;
            border-radius: 60px 60px 0 0;
            transition: width 1s ease;
        }

        .meter-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }

        .meter-label {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }

        .impact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .impact-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .impact-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .impact-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .impact-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flood-size-visual {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .flood-icon {
            font-size: 4rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .flood-description {
            flex: 1;
        }

        .flood-level {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .flood-detail {
            color: #666;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vulnerability-bars {
            display: flex;
            gap: 5px;
            margin: 15px 0;
        }

        .vulnerability-bar {
            height: 20px;
            width: 20px;
            background: #e0e0e0;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .vulnerability-bar.active {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .input-row {
                flex-direction: column;
                align-items: center;
            }
            
            .meter-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌊 Flood Risk Predictor</h1>
            <p>Real-time flood risk assessment for Uganda</p>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <div class="input-group">
                    <label for="city">Select City</label>
                    <select id="city">
                        <option value="Kampala">Kampala</option>
                        <option value="Kabale">Kabale</option>
                        <option value="Kasese">Kasese</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="date">Month & Year</label>
                    <input type="month" id="date" value="2024-07">
                </div>
                <button class="predict-btn" onclick="getPrediction()">
                    🔮 Get Prediction
                </button>
            </div>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing flood risk...</p>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="card risk-overview">
                <h2>🎯 Overall Risk Level</h2>
                <div class="risk-level" id="riskLevel"></div>
                <div class="risk-advice" id="riskAdvice"></div>
            </div>

            <div class="card">
                <h3>📊 Risk Meters</h3>
                <div class="meter-container">
                    <div>
                        <div class="meter">
                            <div class="meter-bg">
                                <div class="meter-fill" id="probFill" style="background: linear-gradient(45deg, #3498db, #2980b9);"></div>
                                <div class="meter-value" id="probValue"></div>
                            </div>
                        </div>
                        <div class="meter-label">Flood Probability</div>
                    </div>
                    <div>
                        <div class="meter">
                            <div class="meter-bg">
                                <div class="meter-fill" id="vulnFill" style="background: linear-gradient(45deg, #e74c3c, #c0392b);"></div>
                                <div class="meter-value" id="vulnValue"></div>
                            </div>
                        </div>
                        <div class="meter-label">Vulnerability</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>🌊 Flood Extent</h3>
                <div class="flood-size-visual">
                    <div class="flood-icon" id="floodIcon"></div>
                    <div class="flood-description">
                        <div class="flood-level" id="floodLevel"></div>
                        <div class="flood-detail" id="floodDetail"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>📈 Impact Assessment</h3>
                <div class="impact-grid">
                    <div class="impact-card">
                        <span class="impact-icon">👥</span>
                        <div class="impact-value" id="peopleAffected"></div>
                        <div class="impact-label">People Affected</div>
                    </div>
                    <div class="impact-card">
                        <span class="impact-icon">⏱️</span>
                        <div class="impact-value" id="duration"></div>
                        <div class="impact-label">Duration (Minutes)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getPrediction() {
            const city = document.getElementById('city').value;
            const date = document.getElementById('date').value + '-01';
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
            
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    city: city,
                    date: date
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Update dashboard
                updateDashboard(data);
                
                // Show dashboard
                document.getElementById('dashboard').classList.add('active');
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                alert('Failed to get prediction. Please try again.');
            });
        }

        function updateDashboard(data) {
            // Risk level
            const riskLevel = document.getElementById('riskLevel');
            riskLevel.textContent = data.risk_level.level + ' Risk';
            riskLevel.style.backgroundColor = data.risk_level.color;
            
            document.getElementById('riskAdvice').textContent = data.risk_level.advice;
            
            // Probability meter
            document.getElementById('probFill').style.width = data.flood_probability + '%';
            document.getElementById('probValue').textContent = data.flood_probability + '%';
            
            // Vulnerability meter
            document.getElementById('vulnFill').style.width = data.vulnerability_index + '%';
            document.getElementById('vulnValue').textContent = data.vulnerability_index + '%';
            
            // Flood size
            document.getElementById('floodIcon').textContent = data.flood_size.icon;
            document.getElementById('floodLevel').textContent = data.flood_size.level + ' Flooding';
            document.getElementById('floodDetail').textContent = data.flood_size.description;
            
            // Impact
            document.getElementById('peopleAffected').textContent = data.people_affected.toLocaleString();
            document.getElementById('duration').textContent = data.duration_hours;
        }

        // Initialize with current date
        document.getElementById('date').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
